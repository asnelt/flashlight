name: Lean Action CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
      # `lake comparator` sandboxes the build with bubblewrap, which needs unprivileged user
      # namespaces; Ubuntu restricts these through AppArmor by default.
      - name: Install bubblewrap
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Check the solution against the challenge
        run: lake comparator

  docs:
    # Only pushes to the default branch publish the documentation.
    # Disabled for now: a clean build with doc-gen4 v4.36.0 fails with "resource exhausted (error
    # code: 12, not enough memory)" (https://github.com/leanprover/doc-gen4/issues/434). The fix is
    # expected in doc-gen4 v4.37.0; after upgrading, restore the condition below.
    # if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    if: false
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment: github-pages
    concurrency:
      group: pages
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
      - uses: leanprover-community/docgen-action@v1

# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
# Flashlight: Lean 4 formalization of the flashlight transformation of copulas.
version: "v0.4"

project:
  name: "Flashlight transformation of copulas"
  description: >
    Formalization of the theorem that the flashlight transformation of a d-copula is again a
    d-copula, together with its inclusion–exclusion formula
    C^F_S(u) = ∑_{A ⊆ S} (-1)^|A| C(κ_{S,A}(1, u), …, κ_{S,A}(d, u)),
    following the proof in Text S1 of Onken et al. (2009).
  authors:
    - "Arno Onken"
  responsible_maintainers:
    - "Arno Onken"
  license: "Apache-2.0"

repository:
  role: "substantive-development"

sources:
  - title: "Analyzing Short-Term Noise Dependencies of Spike-Counts in Macaque Prefrontal Cortex Using Copulas and the Flashlight Transformation"
    authors:
      - "Arno Onken"
      - "Steffen Grünewälder"
      - "Matthias H. J. Munk"
      - "Klaus Obermayer"
    type: article
    venue: "PLoS Computational Biology"
    year: 2009
    volume: 5
    pages: "e1000577"
    id: "https://doi.org/10.1371/journal.pcbi.1000577"
    relationship: formalizes
    author_endorsement: participated
    note: "The theorem is stated in the paper; the formalization is maintained by its first author."
  - title: "Text S1: Proof of the flashlight theorem (supplementary material to Onken et al., 2009)"
    authors:
      - "Arno Onken"
    type: article
    id: "https://doi.org/10.1371/journal.pcbi.1000577.s001"
    relationship: formalizes
    author_endorsement: participated
    note: "The informal proof that the Lean proof follows step by step."
  - title: "Advanced Combinatorics"
    authors:
      - "Louis Comtet"
    type: book
    year: 1974
    relationship: background
    note: "Sieve formula (inclusion–exclusion) for measures, used in the proof."

classification:
  msc2020:
    - "62H05"
    - "60E05"

status:
  scope: "Main theorem of Text S1, fully formalized."
  sorry_count: 0
  sorry_in_definitions: 0
  axioms:
    - propext
    - Classical.choice
    - Quot.sound
  main_results:
    - declaration: "Flashlight.flashlight"
      file: "Flashlight.lean"
      sorry_count: 0
      axioms:
        - propext
        - Classical.choice
        - Quot.sound
      comparator_config: "comparator.json"

fidelity:
  divergences: >
    (1) The index set {1, …, d} is an arbitrary finite type ι. (2) Instead of a random vector U
    on [0,1]^d, the statement takes any probability measure on ι → ℝ whose distribution function
    agrees with the copula C on [0,1]^ι; this is slightly more general. (3) IsCopula requires
    C(1, …, 1) = 1 explicitly, so that the definition is also correct for d = 0. (4) The proof
    step that replaces the events {U_i ≤ 1}, i ∈ S \ A, by the whole space is justified
    explicitly (these events have probability one). (5) The copula property is proved for the
    right-hand side of the flashlight formula and transferred to C^F_S, which agrees with it on
    [0,1]^ι.

automation:
  methods:
    - method: agent
      framework: "Claude Code"
      tool_setup: "Claude Opus 5.5"
      notes: >
        The Lean formalization (definitions, statement and proof) was generated by Claude Opus 5.5
        from the informal proof in Text S1, written by Arno Onken.

review:
  status: "self-assessed"
  reviewers:
    - "Arno Onken"
  notes: >
    The statement and definitions (Challenge.lean) were reviewed against the informal theorem by
    the author of Text S1, and additionally by an AI agent; `lake comparator` confirms that the
    proof proves the statement in Challenge.lean with identical definitions, using only propext,
    Classical.choice and Quot.sound.
